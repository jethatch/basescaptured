<!doctype html>
<!-- Source for docs/img/preview.png (the link-preview image). Render at 1200x630:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=4000 --screenshot=docs/img/preview.png pipeline/og/preview.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@800;900&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f5ecc2; color: #064f6e; }
  .wrap { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; }
  h1 { margin: 0; font: 900 120px/0.92 'Raleway', sans-serif; letter-spacing: -4px; text-transform: uppercase; }
  h1 span { display: block; color: #f99d1b; -webkit-text-stroke: 4px #064f6e; paint-order: stroke fill; }
  p { margin: 26px 0 0; font: 400 32px/1.35 'Roboto Slab', serif; max-width: 640px; }
  .years { position: absolute; right: 72px; top: 56px; font: 900 44px 'Raleway', sans-serif; letter-spacing: -1px; }
  svg.dia { position: absolute; right: 80px; top: 150px; width: 330px; height: 290px; }
  .swarm { position: absolute; left: 72px; right: 72px; bottom: 56px; height: 70px; border-bottom: 4px solid #064f6e; }
  .swarm i { position: absolute; bottom: 4px; width: 14px; height: 14px; border-radius: 50%; background: #064f6e; }
</style>
</head>
<body>
<div class="wrap">
  <div class="years">1975–2025</div>
  <h1>Bases <span>captured</span></h1>
  <p>Every plate appearance leaves bases on the table. Who takes the most of them?</p>
  <svg class="dia" viewBox="0 0 220 190" aria-hidden="true">
    <path d="M110 172 192 92 110 12 28 92Z" fill="none" stroke="#064f6e" stroke-opacity=".35" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M110 172 192 92" stroke="#064f6e" stroke-width="10" stroke-linecap="round"/>
    <path d="M192 92 110 12 28 92" fill="none" stroke="#f99d1b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="183" y="83" width="18" height="18" transform="rotate(45 192 92)" fill="#f5ecc2" stroke="#064f6e" stroke-width="3"/>
    <rect x="101" y="3" width="18" height="18" transform="rotate(45 110 12)" fill="#f5ecc2" stroke="#064f6e" stroke-width="3"/>
    <rect x="19" y="83" width="18" height="18" transform="rotate(45 28 92)" fill="#064f6e" stroke="#064f6e" stroke-width="3"/>
    <path d="M100 164h20v8l-10 10-10-10Z" fill="#f5ecc2" stroke="#064f6e" stroke-width="3"/>
  </svg>
  <div class="swarm" id="swarm"></div>
</div>
<script>
  // a static, swarm-like strip of dots
  const el = document.getElementById('swarm');
  const counts = [1,2,2,3,4,3,5,4,4,3,3,2,2,1,1,0,1,0,0,1];
  counts.forEach((n, i) => {
    for (let k = 0; k < n; k++) {
      const d = document.createElement('i');
      d.style.left = (300 + i * 18) + 'px';
      d.style.bottom = (4 + k * 16) + 'px';
      el.appendChild(d);
    }
  });
</script>
</body>
</html>
